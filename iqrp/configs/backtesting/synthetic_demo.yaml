# Synthetic fixture demo (no downloads, no profitability claim).
# Generate data first, e.g.:
#   python -c "from pathlib import Path; from iqrp.app.backtesting.data.synthetic import write_synthetic_ohlcv; write_synthetic_ohlcv(Path('fixtures/synthetic_bars.parquet'), n_days=60, instruments=['AAA','BBB'], seed=7)"
# Then:
#   python -m iqrp.app.backtesting.run --config iqrp/configs/backtesting/synthetic_demo.yaml

backtest_id: synthetic_demo
strategy_id: buy_and_hold
strategy_version: "1.0.0"

# Points at a local synthetic fixture (generate once; not real market data).
#   .venv/bin/python -c "from pathlib import Path; from iqrp.app.backtesting.data.synthetic import write_synthetic_ohlcv; write_synthetic_ohlcv(Path('iqrp/tests/fixtures/backtesting/synthetic_bars.parquet'), n_days=60, instruments=['AAA','BBB'], seed=7)"
dataset_path: iqrp/tests/fixtures/backtesting/synthetic_bars.parquet
dataset_id: synthetic_demo
dataset_version: "1.0.0"
adapter: parquet

universe: []
start: "2020-01-01"
end: "2020-03-01"
frequency: daily
initial_capital: 1000000.0
currency: USD
timezone: UTC
seed: 7
output_dir: results/synthetic_demo_out

commission_bps: 0.0
spread_bps: 1.0
slippage_bps: 0.0

risk_config:
  max_gross_leverage: 1.0

strategy_params:
  mode: equal_weight

meta:
  purpose: synthetic_pipeline_demo
  disclaimer: Synthetic fixture path for smoke / demo only. Not real market data.
