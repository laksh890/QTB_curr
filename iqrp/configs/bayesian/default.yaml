# @package bayesian
# Institutional Bayesian Regime Switching Engine defaults.

enabled: true
n_states: 3
n_features: 1
state_names: null
random_seed: 42
store_dir: data/bayesian
output_dir: data/reports/bayesian
model_type: bayesian_hmm  # bayesian_hmm | bayesian_markov_switching

emission:
  type: gaussian  # gaussian | multivariate_gaussian
  covariance_type: diag  # diag | full

priors:
  transition_alpha: 1.0
  initial_alpha: 1.0
  mean_prior_strength: 0.1
  mean_prior_location: 0.0
  invgamma_shape: 2.0
  invgamma_scale: 1.0
  wishart_df: 3.0
  wishart_scale: 1.0

inference:
  algorithm: gibbs  # gibbs | metropolis | hmc | variational
  n_chains: 2
  n_samples: 200
  burn_in: 50
  thin: 1
  target_accept: 0.65
  step_size: 0.05
  leapfrog_steps: 10
  n_jobs: 2
  checkpoint_every: 0
  resume: false

variational:
  max_iter: 100
  tol: 1.0e-4
  learning_rate: 0.1

online:
  window_size: 0
  update_frequency: 1
  warm_start: true

forecasting:
  default_horizon: 5
  confidence_level: 0.95
  n_posterior_draws: 50

model_comparison:
  min_states: 2
  max_states: 4
  criterion: waic  # waic | loo | marginal_likelihood

columns:
  timestamp: open_time
  observation_columns: null

visualization:
  enabled: true
  max_points: 500

serialization:
  format: json
