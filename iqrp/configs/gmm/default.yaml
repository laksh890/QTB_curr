# @package gmm
# Institutional Gaussian Mixture Regime Detection Engine defaults.

enabled: true
n_components: 3
n_features: 1
state_names: null
random_seed: 42
store_dir: data/gmm
output_dir: data/reports/gmm
model_type: gmm  # gmm | bayesian_gmm

covariance:
  type: full  # full | diag | tied | spherical
  reg_covar: 1.0e-6

initialization:
  method: kmeans  # random | kmeans | kmeans++ | hierarchical | user
  n_restarts: 3

training:
  max_iter: 100
  tol: 1.0e-4
  early_stopping: true
  n_jobs: 2
  warm_start: false

bayesian:
  weight_concentration_prior: 1.0
  mean_precision_prior: 1.0
  degrees_of_freedom_prior: null
  covariance_prior_scale: 1.0

preprocessing:
  standardize: true
  whiten: false
  pca_components: null  # null | int
  ica_components: null  # null | int

online:
  window_size: 0
  update_frequency: 1
  warm_start: true
  adaptive_covariance: true

model_selection:
  min_components: 1
  max_components: 5
  criterion: bic  # aic | bic | icl | log_likelihood | cv
  cv_folds: 3

outlier:
  density_quantile: 0.01
  rare_occupancy: 0.05

forecasting:
  default_horizon: 5
  confidence_level: 0.95

columns:
  timestamp: open_time
  observation_columns: null

visualization:
  enabled: true
  max_points: 500

serialization:
  format: json
