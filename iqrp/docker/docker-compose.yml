services:
  iqrp:
    build:
      context: ../..
      dockerfile: iqrp/docker/Dockerfile
    image: iqrp:foundation
    environment:
      IQRP_CONFIG_DIR: /app/iqrp/configs
    volumes:
      - ../../logs:/app/logs
      - ../../data:/app/data
    command: ["info", "--environment", "development"]
