[tool.poetry]
name = "iqrp"
version = "0.1.0"
description = "Institutional Quantitative Research Platform — foundational research infrastructure"
authors = ["IQRP Team <iqrp@example.com>"]
readme = "README.md"
license = "Proprietary"
packages = [{ include = "iqrp" }]
keywords = ["quantitative-finance", "research", "backtesting", "portfolio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = "^3.13"
polars = "^1.21.0"
numpy = "^2.2.0"
scipy = "^1.15.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
hydra-core = "^1.3.2"
omegaconf = "^2.3.0"
rich = "^13.9.0"
loguru = "^0.7.3"
typer = { extras = ["all"], version = "^0.15.0" }
duckdb = "^1.1.0"
pyarrow = "^19.0.0"
httpx = "^0.28.0"
websockets = "^14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
mypy = "^1.14.0"
ruff = "^0.9.0"
black = "^24.10.0"
pre-commit = "^4.0.0"
types-pyyaml = "^6.0.12"
hypothesis = "^6.122.0"

[tool.poetry.scripts]
iqrp = "iqrp.app.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | notebooks
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["iqrp"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async best practices
    "S",      # bandit security
    "T20",    # no print
    "PTH",    # pathlib
]
ignore = [
    "S101",   # assert allowed in tests
    "S104",   # binding to all interfaces (configurable)
]

[tool.ruff.lint.per-file-ignores]
"iqrp/tests/**/*.py" = ["S101", "T20", "S608"]
"iqrp/scripts/**/*.py" = ["T20"]
"iqrp/notebooks/**/*.py" = ["T20", "E501"]
"iqrp/app/data/storage/duckdb_catalog.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["iqrp"]
force-single-line = false
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
packages = ["iqrp"]
exclude = [
    "notebooks/",
    "docker/",
]

[[tool.mypy.overrides]]
module = [
    "hydra.*",
    "omegaconf.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["iqrp/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=iqrp",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=70",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may use filesystem / DuckDB)",
    "slow: Slow-running tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = false
source = ["iqrp"]
omit = [
    "iqrp/tests/*",
    "iqrp/notebooks/*",
    "iqrp/scripts/*",
    "iqrp/app/api/*",
    "iqrp/app/backtesting/*",
    "iqrp/app/dashboard/*",
    "iqrp/app/execution/*",
    "iqrp/app/live/*",
    "iqrp/app/portfolio/*",
    "iqrp/app/risk/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
    "raise NotImplementedError",
]
