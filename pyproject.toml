[tool.poetry]
name = "iqrp"
version = "0.1.0"
description = "Institutional Quantitative Research Platform — foundational research infrastructure"
authors = ["IQRP Team <iqrp@example.com>"]
readme = "README.md"
license = "Proprietary"
packages = [{ include = "iqrp" }]
keywords = ["quantitative-finance", "research", "backtesting", "portfolio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = "^3.13"
polars = "^1.21.0"
numpy = "^2.2.0"
scipy = "^1.15.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
hydra-core = "^1.3.2"
omegaconf = "^2.3.0"
rich = "^13.9.0"
loguru = "^0.7.3"
typer = { extras = ["all"], version = "^0.15.0" }
duckdb = "^1.1.0"
pyarrow = "^19.0.0"
httpx = "^0.28.0"
websockets = "^14.0"
# Used widely by research/paper paths; pin via poetry.lock once generated
pandas = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
mypy = "^1.14.0"
ruff = "^0.9.0"
black = "^24.10.0"
pre-commit = "^4.0.0"
types-pyyaml = "^6.0.12"
hypothesis = "^6.122.0"

# Optional ML stack used by forecasting/tree/neural code paths.
# NOT in core deps historically — clones without this group + poetry.lock
# cannot reproduce ML campaigns. Install: poetry install --with ml
# Versions matched to a known working research venv (2026-08); regenerate lock.
[tool.poetry.group.ml.dependencies]
scikit-learn = "^1.6.0"
xgboost = "^3.0.0"
lightgbm = "^4.5.0"
catboost = "^1.2.7"
torch = { version = "^2.5.0", optional = false }

[tool.poetry.scripts]
iqrp = "iqrp.app.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | notebooks
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["iqrp"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async best practices
    "S",      # bandit security
    "T20",    # no print
    "PTH",    # pathlib
]
ignore = [
    "S101",   # assert allowed in tests
    "S104",   # binding to all interfaces (configurable)
    # Quantitative code routinely uses matrix/math naming and long lines.
    "E501",   # line length enforced by Black
    "N803",   # argument names (X, y, etc.)
    "N806",   # local variable names (X, y, etc.)
    "N801",   # class naming in generated/compat shims
    "N812",   # import alias casing
    "N815",   # mixedCase in class scope (third-party parity)
    "N817",   # CamelCase imported as acronym
    "N818",   # Exception suffix conventions
    "S110",   # try/except/pass in optional integrations
    "S112",   # try/except/continue in optional integrations
    "S108",   # tempfile paths in tests/tools
    "S603",   # subprocess without shell (trusted internal calls)
    "SIM105", # contextlib.suppress preference
    "SIM108", # ternary preference
    "SIM102", # collapsible if
    "SIM117", # multiple with
    "SIM222", # … or True in coverage probes
    "B017",   # pytest.raises(Exception) in tests
    "B007",   # unused loop control in unpacking
    "B905",   # zip(strict=…) not required everywhere yet
    "RUF002", # unicode in docstrings (math symbols)
    "RUF003", # unicode in comments (math symbols)
    "RUF001", # unicode in strings
    "RUF012", # mutable class defaults (pydantic/dataclass patterns)
    "RUF059", # unused unpacked vars in scientific unpacking
    "RUF005", # list concat style
    "RUF015", # next(iter(...)) style
    "RUF034", # useless if-else in stubs
    "RUF046", # unnecessary int() in numeric paths
    "RUF007", # pairwise preference
    "UP042",  # str Enum migration deferred
    "E741",   # ambiguous variable names (l, O) in math
    "C416",   # list comprehension style
    "T201",   # print in CLIs / diagnostics
]

[tool.ruff.lint.per-file-ignores]
"iqrp/tests/**/*.py" = ["S101", "T20", "S608", "F401", "F841", "B017", "B018", "B009", "SIM105", "SIM108"]
"iqrp/scripts/**/*.py" = ["T20"]
"iqrp/notebooks/**/*.py" = ["T20", "E501"]
"iqrp/app/data/storage/duckdb_catalog.py" = ["S608"]
"iqrp/app/backtesting/run.py" = ["T20"]
"iqrp/app/backtesting/operational_validation.py" = ["T20"]
"iqrp/backtesting/**/*.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["iqrp"]
force-single-line = false
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
# Full strict mode is deferred until the research codebase is typed end-to-end.
# CI still type-checks the package for syntax/import/basic correctness.
strict = false
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
packages = ["iqrp"]
exclude = [
    "notebooks/",
    "docker/",
    "iqrp/tests/",
]

[[tool.mypy.overrides]]
module = [
    "hydra.*",
    "omegaconf.*",
    "polars.*",
    "pandas.*",
    "pyarrow.*",
    "sklearn.*",
    "torch.*",
    "lightgbm.*",
    "xgboost.*",
    "statsmodels.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "iqrp.tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "iqrp.app.backtesting.*",
    "iqrp.app.execution.*",
    "iqrp.app.portfolio.*",
    "iqrp.app.risk.*",
    "iqrp.app.alpha.*",
    "iqrp.app.forecasting.*",
    "iqrp.app.regimes.*",
    "iqrp.app.features.*",
    "iqrp.app.data.*",
    "iqrp.app.simulation.*",
    "iqrp.app.timeseries.*",
    "iqrp.app.math.*",
    "iqrp.app.forecast_intelligence.*",
]
# Gradual typing: keep import/graph checks without blocking CI on historical debt.
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["iqrp/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=iqrp",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=40",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may use filesystem / DuckDB)",
    "slow: Slow-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
branch = false
source = ["iqrp"]
omit = [
    "iqrp/tests/*",
    "iqrp/notebooks/*",
    "iqrp/scripts/*",
    "iqrp/app/api/*",
    "iqrp/app/backtesting/*",
    "iqrp/app/dashboard/*",
    "iqrp/app/execution/*",
    "iqrp/app/live/*",
    "iqrp/app/portfolio/*",
    "iqrp/app/risk/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
    "raise NotImplementedError",
]
